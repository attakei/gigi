current_version = "0.3.0a2"

[[files]]
path = "gigi.nimble"
search = "version       = \"{{current_version}}\""
replace = "version       = \"{{new_version}}\""

[[files]]
path = "pyproject.toml"
search = "version = \"{{current_version}}\""
replace = "version = \"{{new_version}}\""

[[files]]
path = "CHANGES.md"
search = """
### v{{current_version}}
"""
replace = """
### v{{new_version}}

{{nowFormat.dateISO}} (Asia/Tokyo)

### v{{current_version}}
"""



[[files]]
path = "docs/conf.py"
search = "release = \"{{current_version}}\""
replace = "release = \"{{new_version}}\""

[[files]]
path = "src/gigipkg/consts.nim"
search = "  APP_VERSION* = \"{{current_version}}\""
replace = "  APP_VERSION* = \"{{new_version}}\""
