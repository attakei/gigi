---
name: 'Setup Nim'
description: 'Install Nim toolchain with cache of choosenim and nimble'

inputs:
  nim-version:
    description: 'Nim version to install'
    required: false
    default: '2.2.12'

runs:
  using: 'composite'
  steps:
    - name: 'Cache Nim resources'
      uses: actions/cache@v4
      with:
        path: |
          ~/.choosenim
          ~/.nimble
        key: 'nimcaches--${{ runner.os }}-${{ runner.arch }}-${{ inputs.nim-version }}'
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: '${{ inputs.nim-version }}'
